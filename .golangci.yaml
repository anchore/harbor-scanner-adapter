version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - dupl
    - errcheck
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - importas
    - ineffassign
    - misspell
    - nolintlint
    - revive
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    goconst:
      # Structured-log field keys repeat by design across log.WithFields(log.Fields{...})
      # call sites. Hoisting them into constants would risk silently renaming a field that
      # downstream log consumers key on, for no readability gain.
      ignore-string-values:
        - '^(scanId|imageDigest|repository|imageState|resultError|resultIsComplete|UseAnchoreConfiguredCredentials|statusCode|status|method|digest|body|error|err|key|value|type|int|url)$'
    funlen:
      lines: 70
      statements: 50
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - funlen
          - goconst
        path: (.+)_test.go
    paths:
      - .circleci
      - .github
      - scripts
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 25
  uniq-by-line: false
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - .circleci
      - .github
      - scripts
      - third_party$
      - builtin$
      - examples$
