name: "Release"
on:
  push:
    # take no actions on push to any branch...
    branches-ignore:
      - "**"
    # ... only act on tags
    tags:
      - v1.*
      - v2.*

permissions:
  contents: read

jobs:
  quality-gate:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      # we don't want to release commits that have been pushed and tagged, but not necessarily merged onto main
      - name: Ensure tagged commit is on main
        run: |
          echo "Tag: ${GITHUB_REF##*/}"
          git fetch origin main
          git merge-base --is-ancestor ${GITHUB_REF##*/} origin/main && echo "${GITHUB_REF##*/} is a commit on main!"

      - name: Check unit test results
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be #v1.2.0
        id: unit
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # This check name is defined as the github action job name (in .github/workflows/testing.yaml)
          checkName: "Unit tests"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check container build test results
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be #v1.2.0
        id: container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # This check name is defined as the github action job name (in .github/workflows/testing.yaml)
          checkName: "Container Build Test"
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Quality gate
        if: steps.unit.outputs.conclusion != 'success' || steps.container.outputs.conclusion != 'success'
        run: |
          echo "Unit Test Status: ${STEPS_UNIT_OUTPUTS_CONCLUSION}"
          echo "Integration Test Status: ${STEPS_CONTAINER_OUTPUTS_CONCLUSION}"
          false
        env:
          STEPS_UNIT_OUTPUTS_CONCLUSION: ${{ steps.unit.outputs.conclusion }}
          STEPS_CONTAINER_OUTPUTS_CONCLUSION: ${{ steps.container.outputs.conclusion }}

  release:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # required for goreleaser signs section with cosign
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore tool cache
        id: tool-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ github.workspace }}/.tmp
          key: ${{ runner.os }}-tool-${{ hashFiles('Makefile') }}
          lookup-only: true

      - name: Restore go cache
        id: go-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('go.mod') }}-
          lookup-only: true

      - name: Install tools
        run: make bootstrap-tools

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          username: ${{ secrets.ANCHOREINTEGRATIONSWRITE_DH_USERNAME }}
          password: ${{ secrets.ANCHOREINTEGRATIONSWRITE_DH_PAT }}

      # goreleaser picks the tag for a commit by reverse-lexicographic refname order, so a
      # bare vX.Y.Z tag always loses to a prerelease tag (vX.Y.Z-rcN, vX.Y.Z-alpha.N) sitting
      # on the same commit. That would silently rebuild and republish the prerelease instead
      # of the final release. The workflow already knows which tag it was triggered by, so
      # pass it explicitly rather than letting goreleaser guess.
      #
      # For a final release we also pin the changelog's starting point to the previous final
      # release. Left to itself goreleaser would start from the most recent prerelease, so the
      # notes would only cover commits landed after that instead of the whole release.
      - name: Determine release tags
        id: release-tags
        run: |
          echo "current=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            previous=$(git tag -l 'v*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -vx "${GITHUB_REF_NAME}" \
              | head -1)
            echo "Final release ${GITHUB_REF_NAME}; changelog starts from ${previous:-<none>}"
            echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          else
            echo "Prerelease ${GITHUB_REF_NAME}; leaving changelog range to goreleaser"
          fi

      - name: Build & publish release artifacts
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.ANCHOREOPS_GITHUB_INTEGRA_WRITE_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.release-tags.outputs.current }}
          # Empty is safe: goreleaser falls back to auto-detection.
          GORELEASER_PREVIOUS_TAG: ${{ steps.release-tags.outputs.previous }}
